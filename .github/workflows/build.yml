name: Build HCFCore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build HCFCore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HCFCore-JAR
          path: build/libs/*.jar
            # Build refresh