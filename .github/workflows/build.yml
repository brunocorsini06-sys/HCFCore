name: Build HCFCore

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build HCFCore
        run: gradle clean build --no-daemon

      - name: Upload HCFCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: HCFCore-plugin
          path: build/libs/HCFCore-*.jar
          if-no-files-found: error